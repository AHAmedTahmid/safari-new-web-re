name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "Key inspection:"
          ssh-keygen -l -f ~/.ssh/id_deploy || echo "WARNING: ssh-keygen failed to parse id_deploy"
          echo "=== Public key (ensure this is in ~/.ssh/authorized_keys on server) ==="
          ssh-keygen -y -f ~/.ssh/id_deploy || true
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Copies the site files only. Files deleted from the repo are NOT removed
      # from the server; add --delete to rsync if the target folder holds only this site.
      - name: Upload site with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: /var/www/safaribs-site
        run: |
          rsync -avz \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'server.js' \
            --exclude 'README.md' \
            --exclude 'CLAUDE.md' \
            -e "ssh -v -i ~/.ssh/id_deploy -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o PubkeyAcceptedKeyTypes=+ssh-rsa" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
